name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q probe runners stages scripts tests
      - name: Validate artifact counts
        run: python runners/check_artifact.py
      - name: Validate Croissant metadata
        run: python scripts/validate_croissant.py
      - name: Run prompt audit
        run: python scripts/audit_prompts.py --summary-only
      - name: Run tests (v1)
        run: pytest -q tests

  v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r v2/requirements.txt
      - name: Case files are current and the prompt audit is clean
        run: |
          python v2/experiments/e00_prompt_audit.py > /dev/null
          python v2/experiments/e09_inventory.py > /dev/null
      - name: Run tests (v2; CAD-kernel tests skip without v2/.venv-cad)
        run: pytest -q v2/tests
